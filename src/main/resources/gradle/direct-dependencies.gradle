import groovy.json.JsonOutput
import org.gradle.util.GradleVersion

import java.util.concurrent.CopyOnWriteArrayList
import java.util.zip.ZipFile

// Retain details until evaluation ends so user resolution rules have finished changing the target.
def pluginRequests = new CopyOnWriteArrayList()
gradle.beforeSettings { settings ->
    settings.pluginManagement.resolutionStrategy.eachPlugin { details ->
        pluginRequests.add(details)
    }
}

// Runs inside the target build; no dependency on the IDE/plugin classloader.
gradle.projectsEvaluated {
    def options = gradle.startParameter.projectProperties
    if (!options['dependencyCheckerProject']) return
    def targetDirectory = new File(options['dependencyCheckerProject']).canonicalFile
    def target = rootProject.allprojects.find { it.projectDir.canonicalFile == targetDirectory }
    // Init scripts also run for included builds. Only the owning build registers the task.
    if (target == null) return

    rootProject.tasks.register(options['dependencyCheckerTask']) {
        doLast {
            def modules = []
            rootProject.allprojects.sort { it.path }.each { targetProject ->
                def entries = []
                // Legacy plugins use implementation coordinates, not plugin marker coordinates.
                // Inspect only directly declared classpath artifacts; helper/transitive libraries
                // without Gradle plugin descriptors are not plugins.
                def legacyPlugins = []
                def buildscriptConfigurations = targetProject.buildscript.configurations
                if (buildscriptConfigurations.names.contains('classpath')) {
                    def classpath = buildscriptConfigurations.named('classpath').get()
                    def declared = classpath.allDependencies.withType(ExternalModuleDependency)
                    classpath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                        def module = artifact.moduleVersion.id
                        def declaration = declared.find { it.group == module.group && it.name == module.name }
                        if (declaration == null || module.name.endsWith('.gradle.plugin')
                                || !artifact.file.name.endsWith('.jar')) return
                        def containsPlugin = false
                        new ZipFile(artifact.file).withCloseable { jar ->
                            containsPlugin = jar.entries().any { entry ->
                                entry.name.startsWith('META-INF/gradle-plugins/') && entry.name.endsWith('.properties')
                            }
                        }
                        if (containsPlugin) {
                            legacyPlugins.add([group: module.group, name: module.name,
                                               version: declaration.version ?: module.version,
                                               resolved: [group: module.group, name: module.name, version: module.version]])
                        }
                    }
                }
                targetProject.configurations.matching { configuration ->
                    def name = configuration.name.toLowerCase(Locale.ROOT)
                    name.endsWith('compileclasspath') || name.endsWith('runtimeclasspath') ||
                            name.endsWith('implementation')
                }.sort { it.name }.each { configuration ->
                    if (configuration.canBeResolved) {
                        def result = configuration.incoming.resolutionResult
                        // Variant traversal avoids accidentally including other variants of the root.
                        def direct = GradleVersion.current() >= GradleVersion.version('8.11')
                                ? result.rootComponent.get().getDependenciesForVariant(result.rootVariant.get())
                                : result.root.dependencies
                        direct.each { dependency ->
                            def requested = dependency.requested
                            if (!(requested instanceof ModuleComponentSelector) || dependency.constraint) return
                            // Preserve the declared version for update/navigation matching. For BOM-managed
                            // declarations without a version, use the selected version, as the report did.
                            def version = requested.version ?: null
                            if (version == null && dependency instanceof ResolvedDependencyResult) {
                                version = dependency.selected.moduleVersion?.version
                            }
                            def error = dependency instanceof UnresolvedDependencyResult
                                    ? dependency.failure.message : null
                            def selected = dependency instanceof ResolvedDependencyResult
                                           ? dependency.selected.moduleVersion : null
                            // Project substitutions are not Maven artifacts.
                            def resolved = selected != null && dependency.selected.id instanceof ModuleComponentIdentifier
                                           ? [group: selected.group, name: selected.name, version: selected.version] : null
                            entries.add([group: requested.group, name: requested.module,
                                         version: version, error: error, resolved: resolved])
                        }
                    } else {
                        // implementation is normally declarable, not resolvable. Do not force resolution
                        // or lose declarations that have no corresponding classpath configuration.
                        configuration.allDependencies.withType(ExternalModuleDependency).each { dependency ->
                            if (dependency.version) {
                                entries.add([group: dependency.group, name: dependency.name,
                                             version: dependency.version, error: null])
                            }
                        }
                    }
                }
                modules.add([path: targetProject.path, parentPath: targetProject.parent?.path,
                             name: targetProject.name, directory: targetProject.projectDir.canonicalPath,
                             buildFile: targetProject.buildFile.canonicalPath, dependencies: entries,
                             plugins: legacyPlugins + (targetProject == rootProject ? pluginRequests.collect { details ->
                                 [id: details.target.id.id, version: details.target.version]
                             }.findAll { it.version && !it.id.startsWith('org.gradle.') }
                                     .unique { [it.id, it.version] } : [])])
            }
            new File(options['dependencyCheckerOutput']).setText(JsonOutput.toJson(modules), 'UTF-8')
        }
    }
}
